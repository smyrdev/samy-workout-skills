name: Dan
story: >
  36-year-old carpenter, trains alone in his garage before work. Six years of
  on-and-off lifting, the last two consistent. Built his rack setup piece by
  piece and is proud of it; has no interest in joining a gym.
goal_detail: >
  Wants his big-three numbers moving again — bench, squat, deadlift. Chasing a
  140 kg squat and a 180 kg deadlift this year. Size is a side effect he will
  not complain about.
constraints:
  - His right shoulder hates overhead pressing. Years of overhead work on job
    sites plus an old climbing tweak — strict pressing over head reliably
    leaves it aching for days. He never mentions it when filling in forms
    because "it's fine unless I press overhead".
preferences:
  - Barbell-first; sees dumbbells as accessories.
  - Likes low-rep heavy top sets followed by back-off volume.
interview_answers: {}
