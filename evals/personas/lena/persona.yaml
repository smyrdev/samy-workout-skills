name: Lena
story: >
  29-year-old physiotherapy assistant and competitive-adjacent physique
  hobbyist. Eight years of serious training, meticulous logbook, trains at a
  large facility with every machine imaginable. Recovers well and likes long
  sessions.
goal_detail: >
  This block is about back width above everything — she wants a wider lat
  sweep for next summer. Vertical pulling is the priority; she would rather
  drop a leg exercise than a pulldown variation.
constraints:
  - Years of heavy pressing have left her elbows grumpy about skull crushers
    and other elbow-hinge triceps work under heavy load; cable pressdowns and
    dips feel fine.
preferences:
  - Loves cables and machines for isolation work, free weights for the big
    lifts.
  - Wants her two rest days to actually be rest — no "optional" seventh day.
interview_answers: {}
