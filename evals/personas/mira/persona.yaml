name: Mira
story: >
  27-year-old graphic designer, first structured training program. Joined a
  commercial gym three months ago and has mostly used the treadmill; regular
  runner, comfortable with cardio, brand new to lifting. Somewhat intimidated
  by the free-weight area.
goal_detail: >
  Wants visible arm and shoulder growth — "toned arms" is the phrase she uses.
  General strength is welcome but appearance is the motivator.
constraints:
  - Occasional soreness in the left knee after long runs; nothing diagnosed,
    but deep heavy knee flexion on bad days is uncomfortable.
preferences:
  - Prefers machines and dumbbells over barbells while she builds confidence.
  - Sessions must genuinely fit inside a lunch break plus change time.
interview_answers: {}
