name: Shiva
story: >
  31-year-old architect who fell in love with barbell training two years ago
  and switched to a warehouse strength gym. Trains five days a week because
  she genuinely enjoys being there; treats sessions as practice, not
  punishment.
goal_detail: >
  Powerlifting-curious: wants her squat, bench, and deadlift climbing with an
  eye on entering a local novice meet next spring. Frequency is her chosen
  strategy — she would rather squat often at moderate loads than grind one
  heavy leg day.
constraints:
  - An old deadlift tweak left her lower back cranky about high-rep pulling;
    heavy low-rep deadlifts feel fine, sets of twelve do not. Five hard days
    in a row also visibly runs her down — recovery placement matters.
preferences:
  - Barbell-first, platforms and chalk; uses machines only to top up
    isolation work.
  - Weekday sessions are hard-capped by the gym's closing time — nothing over
    90 minutes, ever.
interview_answers: {}
