name: Ehsan
story: >
  36-year-old software engineer who jokes that he has the body of a
  60-year-old. Fifteen years at a desk, chronic sleep debt, bloodwork that
  came back with very low testosterone — he is working on that with his
  doctor. Skinny-fat: 74 kg at 175 cm with soft arms and a belly, no visible
  muscle. A scooter accident three years ago left his left leg noticeably
  weaker than the right. Trains in the small coworking-space gym inside his
  office building — dumbbells, benches, a cable station, no barbell — because
  keeping the barrier low is the only way he shows up.
goal_detail: >
  Wants to stop feeling fragile: build some muscle, fix his posture, and —
  above all — bring his injured left leg back to parity with the right.
  Twenty to forty minutes is a hard honesty budget — longer plans have failed
  him three times before.
constraints:
  - Left leg is post-accident weak — it fatigues first and buckles under
    loads the right handles easily. Two-legged lifts let the strong side
    quietly take over, so he wants leg work done one leg at a time (splits,
    lunges, single-leg deadlifts), letting the weaker left side set the
    weight and slowly catch up.
  - Joints ache more or less constantly — wrists, elbows, knees. Nothing
    diagnosed beyond "hypermobility plus desk life", but jumping into loaded
    movements too fast has burned him before. Slow progressions and
    joint-friendly variations matter more than optimal stimulus.
  - Very low testosterone means recovery is poor; back-to-back hard days
    wreck him.
preferences:
  - Limited to what the office gym has — dumbbells up to 30 kg, benches, one
    cable station. No barbell, no rack, and it gets crowded at lunchtime.
  - Would rather do less and stay consistent than be ambitious and quit again.
