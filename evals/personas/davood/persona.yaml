name: Davood
story: >
  33-year-old software engineer in Tehran, trains at a crowded chain gym after
  work. Four years of lifting with decent technique and strong opinions about
  what he will and will not do. Keeps his personal rules file carefully
  up to date.
goal_detail: >
  Wants a bigger chest and arms while keeping his strength moving on bench and
  deadlift — hence "both" as the goal. His rules file says the rest: chest and
  biceps focus, bench press and deadlift always in the program.
constraints:
  - Avoids anything behind-the-neck and upright rows — a coach once told him
    they wreck shoulders and he never argued. These live in his rules file as
    hard exclusions.
  - Refuses the smith machine entirely; he calls it "the fake barbell".
preferences:
  - Peak-hour crowds mean he would rather not camp on two stations; compact
    sessions that flow station to station suit him.
interview_answers: {}
