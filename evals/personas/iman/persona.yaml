name: Iman
story: >
  49-year-old taxi dispatcher, 140 kg at around 50% body fat, sedentary for
  most of his adult life. His doctor finally got through to him this spring.
  He joined the small gym two streets from his flat because it is close enough
  that he cannot talk himself out of it, and goes three times a week.
goal_detail: >
  Wants to lose weight, move without getting winded, and be strong enough to
  play with his grandchildren on the floor. "Both" strength and muscle, but
  really: health. Any plan that scares him off in week two has failed.
constraints:
  - Total novice — has never touched a barbell. Getting up from the floor is
    hard; anything requiring him to lie flat on a bench and get back up
    repeatedly, or kneel on the floor, is a genuine obstacle at his size.
  - Knees complain on stairs; deep squatting is currently out of reach even
    unloaded.
preferences:
  - Feels safest on machines and seated exercises; self-conscious in the
    free-weight corner.
  - Simple beats optimal — the same short list of exercises every visit is a
    feature, not a bug.
interview_answers: {}
